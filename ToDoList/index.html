<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  
    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand mb-0 h1">My To-Do List</span>
    </nav>

    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 p-4">
                    
              
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold mb-1">Task Manager</h1>
                        <p class="text-muted small">Organize your tasks and stay productive.</p>
                    </div>

                   
                    <div class="input-group mb-1">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." aria-label="New task input">
                        <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
                    </div>
                  
                    <div id="errorMsg" class="text-danger small mb-3" style="display: none;"></div>

           
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-secondary fw-medium">Your tasks</span>
                        <span id="taskCounter" class="badge bg-primary rounded-pill px-3 py-2">0 remaining</span>
                    </div>

                    
                    <div class="btn-group w-100 mb-4" role="group" aria-label="Task filters">
                        <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
                    </div>

                   
                    <ul id="taskList" class="list-group mb-4">
                        <!-- Tasks will be dynamically injected here -->
                    </ul>

            
                    <div id="emptyState" class="text-center text-muted py-3">
                        No tasks yet. Add your first task!
                    </div>

                   
                    <div class="d-flex justify-content-end">
                        <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm">Clear Completed</button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
